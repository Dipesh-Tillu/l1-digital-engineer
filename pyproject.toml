[project]
name = "l1agent"
version = "0.1.0"
description = "L1 Support Agent framework - knowledge-grounded L1 ticket resolution with a confidence gate"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Real embedding/LLM backends beyond the built-in local fallback. Lazily
# imported inside their provider classes (store/embeddings.py,
# agent/tools/draft_response.py, finetune/backends/openai_backend.py) -
# not required for the base install to work.
providers = [
    "voyageai>=0.2",
    "openai>=1.0",
]
# Local weight fine-tuning (finetune/backends/local_lora_backend.py) - heavy:
# pulls in torch and downloads a base model on first run. Only needed for
# `l1agent finetune run --backend local_lora`.
finetune = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.11",
    "trl>=0.9",
    "datasets>=2.19",
    "accelerate>=0.30",
]

[project.scripts]
l1agent = "l1agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l1agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
